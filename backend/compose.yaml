services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
      POSTGRES_DB: kms
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kms_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kms -d kms"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  kms_postgres:
