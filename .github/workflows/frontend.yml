name: Frontend checks
on:
  push:
    paths: ["apps/web/**", "package*.json", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["apps/web/**", "package*.json", ".github/workflows/frontend.yml"]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
