name: Backend checks
on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  push:
    branches: ['feat/day01-backend-foundation', develop]
    paths: ['backend/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kms
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: kms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kms -d kms_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://kms:ci-only-password@localhost:5432/kms_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip check
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - run: alembic upgrade head --sql
